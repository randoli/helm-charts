# Values passed through to the upstream kubescape-operator chart.
# Full upstream value reference:
# https://github.com/kubescape/helm-charts/blob/main/charts/kubescape-operator/values.yaml
kubescape-operator:
  # ksNamespace must match the Helm install namespace.
  # The randoli-agent umbrella chart sets this to "randoli-agents" in its values.yaml.
  # Override if installing to a different namespace.
  ksNamespace: ""

  clusterName: "cluster"

  # Default posture frameworks used when a scan has no explicit targetNames
  # (scheduled scan with empty scanV1, startup scan, exception-triggered rescan).
  # Empty (default) = scan all frameworks. Names are case-insensitive.
  # Available frameworks (kubescape/regolibrary):
  #   General:    AllControls, security, NSA, MITRE, SOC2, ISM,
  #               ArmoBest, DevOpsBest, WorkloadScan, ClusterScan
  #   CIS:        cis-v1.10.0, cis-v1.12.0              (generic Kubernetes)
  #               cis-eks-t1.7.0, cis-eks-t1.8.0        (EKS)
  #               cis-aks-t1.2.0, cis-aks-t1.8.0        (AKS)
  #               cis-gke-v1.9.0                        (GKE)
  # Note: "security" is scanned in addition when operator.triggerSecurityFramework
  # is true (upstream default).
  # Override at install time, e.g.:
  #   --set 'securityScans.kubescape-operator.defaultFrameworks={nsa,mitre,cis-v1.10.0}'
  defaultFrameworks: []

  # safe-to-evict: these Deployments use emptyDir volumes (scan results,
  # grype DB cache, tmp dirs — all regenerable), which otherwise block
  # cluster-autoscaler scale-down and node decommission. Opt in to eviction.
  kubescape:
    name: randoli-sec-kubescape
    continuousScan: enable
    submit: true
    serviceMonitor:
      enabled: false
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

  operator:
    name: randoli-sec-kubescape-operator
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

  kubevuln:
    name: randoli-sec-kubevuln
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    image:
      repository: quay.io/kubescape/kubevuln
      tag: v0.3.566
      pullPolicy: IfNotPresent

  storage:
    name: "randoli-sec-kubescape-storage"

  nodeAgent:
    name: randoli-sec-kubescape-node-agent

  synchronizer:
    name: randoli-sec-kubescape-synchronizer

  prometheusExporter:
    name: randoli-sec-kubescape-prometheus-exporter

  # Randoli App Insights: scan statefulsets and daemonsets in addition to deployments
  kubescapeScheduler:
    scanPolicy:
      resources: ["deployments","statefulsets","daemonsets"]

  # Exclude system namespaces from scanning
  excludeNamespaces: "kube-system,kube-public,kube-node-lease,kubeconfig,gmp-system,gmp-public"

  customScheduling:
    tolerations: []
    nodeSelector: {}
    affinity: {}

  imagePullSecrets: ""

  capabilities:
    # Configuration scanning related capabilities
    # Continuous Scanning continuously evaluates the security posture of your cluster.
    continuousScan: enable
    nodeScan: disable

    # Image vulnerabilities scanning related capabilities
    relevancy: disable 

    # Runtime related capabilities
    runtimeObservability: disable
    networkPolicyService: disable
    networkEventsStreaming: disable
    runtimeDetection: disable
    malwareDetection: disable
    nodeProfileService: disable
    admissionController: disable
    httpDetection: disable
    kubescapeOffline: enable

  continuousScanning:
    configMapName: cs-matching-rules

    # Matching rules for the monitored resources.
    # Kubescape will watch resources of every provided GVR across the provided
    # namespaces.
    matchingRules:
      match:
        - apiGroups: ["apps"]
          apiVersions: ["v1"]
          resources: ["deployments","statefulsets","daemonsets"]
      namespaces: []
