{{/* Lets the vmsingle ServiceAccount read the OpenShift /federate endpoint. */}}
{{- if eq (include "victoria-metrics.ocpFederation.enabled" .) "true" -}}
{{- $server := (index .Values "victoria-metrics-single").server -}}
{{- $name := $server.fullnameOverride -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-monitoring-view
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
{{- end -}}
