# Values passed through to the upstream opencost chart.
# Full upstream value reference:
# https://github.com/opencost/opencost-helm-chart/blob/main/charts/opencost/values.yaml
opencost:
  fullnameOverride: "randoli-cmk-opencost"

  imagePullSecrets: []

  opencost:
    exporter:
      image:
        registry: docker.io
        repository: randoli/opencost
        # OpenCost fork v1.121.4: GCP pricing logs show the auth source and identity (customer key -> CLOUD_PROVIDER_API_KEY -> Google default credentials).
        tag: "1.121.4"
        pullPolicy: IfNotPresent

      # Prometheus query/subquery resolution -> PROMETHEUS_QUERY_RESOLUTION_SECONDS.
      # Default 300s (5m) is too coarse for the sparse LLM token metric, so /llm returns empty.
      # 60s (1m) captures it; dense CPU/RAM metrics are unaffected.
      prometheusDataSource:
        queryResolutionSeconds: 60

      # CLUSTER_ID is set by the upstream chart via defaultClusterId below.
      # Override at install time: --set costManagement.opencost.opencost.exporter.defaultClusterId=<name>
      defaultClusterId: "default-cluster"

      env:
        # Downward API — used by RANDOLI_AGENT_SERVER and PROMETHEUS_URL below
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RANDOLI_AGENT_SERVER
          value: "http://randoli-agent.$(POD_NAMESPACE).svc:8080"
        - name: RANDOLI_AGENT_RETRY_INTERVAL_IN_SECONDS
          value: '5'
        # INSECURE_SKIP_VERIFY is emitted by the upstream opencost chart from
        # prometheus.insecureSkipVerify below. Setting it here too produces a
        # duplicate env key that ArgoCD's server-side-apply diff rejects.

      extraVolumeMounts: []

      tolerations: []
      nodeSelector: {}
      affinity: {}

    extraContainers:
      - name: network-cost-metrics
        image: "docker.io/randoli/network-cost-metrics:1.0.1"
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
            name: http-metrics
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: METRIC_GENERATION_INTERVAL
            value: "2m"
          # Metrics backend URL. Sourced from a ConfigMap because
          # opencost renders extraContainers with plain toYaml (no template), so a
          # Helm expression inline here would not be evaluated. See templates/configmap-network-metrics.yaml.
          - name: PROMETHEUS_URL
            valueFrom:
              configMapKeyRef:
                name: randoli-network-cost-metrics-config
                key: PROMETHEUS_URL
          - name: PROMETHEUS_TIMEOUT
            value: "30s"

    prometheus:
      # Drives the upstream-rendered INSECURE_SKIP_VERIFY env var (deployment.yaml).
      insecureSkipVerify: true
      # PROMETHEUS_SERVER_ENDPOINT comes from the umbrella's shared
      # "prometheus-server-endpoint" helper (bundled Prometheus → bundled
      # VictoriaMetrics → external global.prometheus.url). Upstream renders
      # external.url through tpl, and named templates are global across charts.
      # Upstream allows only one of internal / external / amp.
      internal:
        enabled: false
      external:
        enabled: true
        url: '{{ include "prometheus-server-endpoint" . }}'

    ui:
      enabled: false

    metrics:
      kubeStateMetrics:
        emitKsmV1Metrics: false
        emitKsmV1MetricsOnly: false

  service:
    extraPorts:
      - name: http-metrics
        port: 8080
        targetPort: 8080

  extraVolumes: []
