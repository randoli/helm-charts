global:
  tolerations:
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule
  daemonsets:
    tolerations:
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists
  prometheus:
    install: true

tags:
  costManagement: true
  observability: true
  security: true

randoli-agent:
  tags:
    costManagement: true
    observability: true
    security: true
  agent:
    image:
      tag: dev1
    tektonPipeline:
      enabled: true

  observability:
    otel:
      operator:
        enabled: true
    netobserv:
      enabled: true
    security:
      enabled: true
    vector:
      enabled: true
    logs:
      applyVectorPipeline: true
      lokiUrl: http://randoli-obs-loki-dist-distributor.randoli-agents-dev1.svc:3100
    loki:
      singleBinary:
        enabled: false
      distributed:
        enabled: true
    tempo:
      singleBinary:
        enabled: false
      distributed:
        enabled: true
  tproxy:
    keycloakIssuer: 'https://sso.dev.az.central-india.randolicloud.ca/auth/realms/randoli-dev'
    cors: '*'
    tunnelServerUrl: 'https://randoli-proxy-tunnel.dev.az.central-india.randolicloud.ca'
    mode: tunnel

  costManagement:
    vpaOperator:
      enabled: true
    opencost:
      opencost:
        ui:
          enabled: true

  prometheus:
    prometheus:
      server:
        retention: "30d"
        retentionSize: "90GB"
        persistentVolume:
          size: 100Gi
        extraFlags:
          - web.enable-lifecycle
          - web.enable-otlp-receiver
          - web.enable-remote-write-receiver
      kube-state-metrics:
        enabled: true
      prometheus-node-exporter:
        enabled: true
        # ============================================================
        # DAEMONSETS - Mark safe to evict so drains aren't blocked
        # ============================================================
        podLabels:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        tolerations:
          - key: "node.kubernetes.io/unschedulable"
            operator: "Exists"
            effect: "NoSchedule"
      prometheus-pushgateway:
        enabled: true

  tempoDistributed:
    tempo-distributed:
      global:
        extraEnv:
          - name: TEMPO_AZURE_ACCOUNT_KEY
            valueFrom:
              secretKeyRef:
                name: tempo-azure-storage
                key: ACCOUNT_KEY
      storage:
        trace:
          backend: azure
          azure:
            container_name: tempo-traces
            storage_account_name: devtempodata
            storage_account_key: ${TEMPO_AZURE_ACCOUNT_KEY}
      # -config.expand-env=true cannot live in global.extraArgs — memcached
      # parses it as `-c onfig...` (max connections) and crashes. Set per-Tempo
      # component instead.
      compactor:
        extraArgs:
          - "-config.expand-env=true"
        config:
          compaction:
            block_retention: 720h
      distributor:
        extraArgs:
          - "-config.expand-env=true"
      ingester:
        extraArgs:
          - "-config.expand-env=true"
        persistence:
          enabled: true
          size: 50Gi
      querier:
        extraArgs:
          - "-config.expand-env=true"
      queryFrontend:
        mcp_server:
          enabled: true 
        extraArgs:
          - "-config.expand-env=true"
      metricsGenerator:
        enabled: true
        extraArgs:
          - "-config.expand-env=true"
      # ============================================================
      # ROLLOUT OPERATOR - Fix webhook blocking node drains
      # ============================================================
      rollout_operator:
        enabled: true
        webhooks:
          failurePolicy: Ignore    # Critical fix - don't block on webhook failure
          timeoutSeconds: 5        # Fail faster if unreachable

  lokiDistributed:
    loki:
      minio:
          enabled: false
          
      loki:
        schemaConfig:
          configs:
            - from: 2024-01-01
              store: tsdb
              object_store: azure
              schema: v13
              index:
                prefix: loki_index_
                period: 24h

        storage:
          type: azure
          bucketNames:
            chunks: loki-logs-dist
            ruler: loki-logs-dist
            admin: loki-logs-dist
          azure:
            accountName: devlokidata
            accountKey: ${LOKI_AZURE_ACCOUNT_KEY} 
            requestTimeout: 30s
            useManagedIdentity: false

        compactor:
          delete_request_store: azure
      
        limits_config:
          split_queries_by_interval: 6h
          tsdb_max_query_parallelism: 12
        
        # ruler:
        #   replicas: 1
        #   enable_api: true
        
        chunk_store_config:
          chunk_cache_config:
            memcached:
              batch_size: 256
              parallelism: 10
            memcached_client:
              host: loki-memcached
              service: memcached

        query_range:
          cache_results: true
          results_cache:
            cache:
              memcached_client:
                consistent_hash: true
                host: loki-memcached
                service: memcached
                max_idle_conns: 32
                timeout: 200ms
                update_interval: 5m

      queryFrontend:
        max_outstanding_per_tenant: 2048

      ingester:
        replicas: 3
        terminationGracePeriodSeconds: 120
        extraArgs:
          - -config.expand-env=true
        extraEnvFrom:
          - secretRef:
              name: loki-azure-creds
        extraEnv:
          - name: LOKI_CHUNK_IDLE_PERIOD
            value: "10m"
          - name: LOKI_CHUNK_BLOCK_SIZE
            value: "4194304"
        tolerations:
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule

      querier:
        max_concurrent: 4
        extraArgs:
          - -config.expand-env=true
        extraEnvFrom:
          - secretRef:
              name: loki-azure-creds
        tolerations:
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule

      compactor:
        extraArgs:
          - -config.expand-env=true
        extraEnvFrom:
          - secretRef:
              name: loki-azure-creds
        tolerations:
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule

      indexGateway:
        extraArgs:
          - -config.expand-env=true
        extraEnvFrom:
          - secretRef:
              name: loki-azure-creds
        tolerations:
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule

      queryScheduler:
        extraArgs:
          - -config.expand-env=true
        extraEnvFrom:
          - secretRef:
              name: loki-azure-creds
        tolerations:
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule
      
      # ruler:
      #   enabled: true
      #   extraArgs:
      #     - -config.expand-env=true
      #   extraEnvFrom:
      #     - secretRef:
      #         name: loki-azure-creds

  vectorOperator:
    vector-operator:
      vector:
        agent:
          annotations:
            cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
          tolerations:
            - key: kubernetes.azure.com/scalesetpriority
              operator: Equal
              value: spot
            - key: CriticalAddonsOnly
              operator: Exists
            - key: "node.kubernetes.io/unschedulable"
              operator: "Exists"
              effect: "NoSchedule"
          configCheck:
            tolerations:
              - key: kubernetes.azure.com/scalesetpriority
                operator: Equal
                value: spot

  securityScans:
    kubescape-operator:
      # Must match the Helm install namespace (-n flag).
      ksNamespace: "randoli-agents-dev1"
      customScheduling:
        podLabels:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        tolerations: 
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
          - key: "node.kubernetes.io/unschedulable"
            operator: "Exists"
            effect: "NoSchedule"

  # ============================================================
  # VPA - Fix PDBs with 0 allowed disruptions
  # ============================================================
  vpa:
    vertical-pod-autoscaler:
      admissionController:
        replicas: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - admission-controller
                topologyKey: kubernetes.io/hostname
        podLabels:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

      recommender:
        replicas: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - recommender
                topologyKey: kubernetes.io/hostname
        podLabels:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

      updater:
        replicas: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - updater
                topologyKey: kubernetes.io/hostname
        podLabels:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

  opentelemetry-operator:
    opentelemetry-operator:
      admissionWebhooks:
        autoGenerateCert:
          recreate: true
