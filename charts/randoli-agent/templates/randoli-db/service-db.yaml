{{- /*
Service fronting the randoli-db (PostgreSQL) StatefulSet. All DB clients
(agent, tproxy, SRE agent) reach the database through this stable ClusterIP.
*/ -}}
{{- if not (include "agent-db-external" .) }}
apiVersion: v1
kind: Service
metadata:
  name: randoli-db
  namespace: {{ include "randoli-agent.namespace" . }}
  labels:
    app.kubernetes.io/component: randoli-db
    {{- include "labels" . | nindent 4 }}
spec:
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: randoli-db
  type: ClusterIP
{{- end }}
