{{- /*
Generate the DB secret holding the PostgreSQL role passwords used by the
in-chart randoli-db server and its clients (agent, tproxy, SRE agent).

The Job runs as a pre-install / pre-upgrade hook (ArgoCD translates this to
PreSync) and is idempotent: it creates the Secret when missing and adds any
missing keys to an existing one (e.g. a Secret left by the GizmoSQL-based
chart, which only had username/password). Existing keys are never rotated.

Skipped with global.db.external.enabled — the external server's credentials
come from global.db.external.existingSecret.
*/ -}}
{{- if not (include "agent-db-external" .) }}
{{- $secretName := include "agent-db-secret-name" . -}}
{{- $bootstrapName := printf "%s-db-bootstrap" (include "randoli-agent.fullname" .) -}}
{{- $namespace := include "randoli-agent.namespace" . -}}
{{- $hookAnnotations := dict
  "helm.sh/hook" "pre-install,pre-upgrade"
  "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded"
-}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ $namespace }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    helm.sh/hook-weight: "-5"
  labels:
    app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db-bootstrap
    {{- include "labels" . | nindent 4 }}
{{- with .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ $namespace }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    helm.sh/hook-weight: "-4"
  labels:
    app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db-bootstrap
    {{- include "labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ $namespace }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    helm.sh/hook-weight: "-3"
  labels:
    app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db-bootstrap
    {{- include "labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $bootstrapName }}
    namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $bootstrapName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ $namespace }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    helm.sh/hook-weight: "-1"
  labels:
    app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db-bootstrap
    {{- include "labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db-bootstrap
    spec:
      serviceAccountName: {{ $bootstrapName }}
      restartPolicy: OnFailure
      {{- with coalesce .Values.agent.tolerations .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.agent.nodeSelector .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.agent.affinity .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ .Values.agent.db.bootstrapImage }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              SECRET={{ $secretName | quote }}
              NS={{ $namespace | quote }}
              KEYS="postgres-password agent-password sre-agent-password tproxy-password"
              gen() { tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32; }
              if ! kubectl get secret "$SECRET" -n "$NS" >/dev/null 2>&1; then
                ARGS=""
                for k in $KEYS; do ARGS="$ARGS --from-literal=$k=$(gen)"; done
                kubectl create secret generic "$SECRET" -n "$NS" $ARGS
                echo "Secret $SECRET created in namespace $NS."
                exit 0
              fi
              for k in $KEYS; do
                # Prints 1 when the key is set; empty when missing (or no data).
                HAS="$(kubectl get secret "$SECRET" -n "$NS" -o "go-template={{ "{{" }}if index .data \"$k\"{{ "}}" }}1{{ "{{" }}end{{ "}}" }}" 2>/dev/null || true)"
                if [ "$HAS" != "1" ]; then
                  VAL="$(gen | base64 | tr -d '\n')"
                  kubectl patch secret "$SECRET" -n "$NS" --type merge -p "{\"data\":{\"$k\":\"$VAL\"}}"
                  echo "Added missing key $k to secret $SECRET."
                fi
              done
              echo "Secret $SECRET is up to date."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
