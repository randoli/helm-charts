{{- /*
Randoli agent DB: a single PostgreSQL server shared by the agent, tproxy and
the SRE agent. Not rendered when global.db.external.enabled is set.

First boot runs randoli-db-init (roles + database). Schema migrations are run
by the agent pod's `migrate` init container, not here.
*/ -}}
{{- if not (include "agent-db-external" .) }}
{{- $secretName := include "agent-db-secret-name" . -}}
{{- $pg := .Values.agent.db.postgres -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: randoli-db
  namespace: {{ include "randoli-agent.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: randoli-db
    {{- include "labels" . | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.agent.db.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.global.annotations .Values.agent.db.annotations }}
  annotations:
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.agent.db.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  replicas: 1
  serviceName: randoli-db
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: randoli-db
  # volumeClaimTemplates PVCs (data-randoli-db-0) are not deleted on
  # uninstall; delete them manually once the data is no longer needed.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: randoli-db
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with (coalesce .Values.agent.db.storage.storageClassName .Values.agent.storageClassName) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.agent.db.storage.pvSize }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "randoli-agent.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: randoli-db
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.agent.db.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/init: {{ include (print $.Template.BasePath "/randoli-db/configmap-db-init.yaml") . | sha256sum }}
        # The memory-backed /dev/shm emptyDir would otherwise block
        # cluster-autoscaler scale-down; data lives on the PVC.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        {{- with .Values.global.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.agent.db.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # preStop requests a fast shutdown (rolls back open transactions and
      # checkpoints); the grace period covers the checkpoint on large DBs.
      terminationGracePeriodSeconds: 120
      volumes:
        - name: init-scripts
          configMap:
            name: randoli-db-init
            defaultMode: 0555
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $pg.shmSize }}
        - name: run
          emptyDir: {}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "randoli-agent.image" .Values.agent.db.image | quote }}
          imagePullPolicy: {{ .Values.agent.db.image.pullPolicy }}
          args:
            - -c
            - max_connections={{ $pg.maxConnections }}
            - -c
            - shared_buffers={{ $pg.sharedBuffers }}
            - -c
            - effective_cache_size={{ $pg.effectiveCacheSize }}
            - -c
            - work_mem={{ $pg.workMem }}
            - -c
            - maintenance_work_mem={{ $pg.maintenanceWorkMem }}
            - -c
            - timezone=UTC
            - -c
            - log_timezone=UTC
            {{- range $k, $v := $pg.extraConfig }}
            - -c
            - {{ printf "%s=%v" $k $v | quote }}
            {{- end }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: postgres-password
            - name: RANDOLI_AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: agent-password
            - name: RANDOLI_SRE_AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: sre-agent-password
            - name: RANDOLI_TPROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: tproxy-password
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "pg_ctl -D \"$PGDATA\" -m fast -w -t 110 stop || true"]
          # Crash recovery (WAL replay) can take a while after an unclean
          # stop; liveness only applies once startup succeeds.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            # Unix socket dir; writable for arbitrary UIDs (OpenShift).
            - name: run
              mountPath: /var/run/postgresql
          resources:
            {{- toYaml .Values.agent.db.resources | nindent 12 }}
      {{- if .Values.global.openshift.enabled }}
      # Let the SCC assign the UID and fsGroup from the namespace ranges — an
      # explicit fsGroup is rejected on OpenShift. The postgres image supports
      # arbitrary UIDs (nss_wrapper) as long as PGDATA is group-writable.
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      {{- else }}
      securityContext:
        # UID/GID of the postgres user in the official image.
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        {{- with .Values.agent.securityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Skip the recursive chown on volume mount unless the root ownership
        # actually differs — keeps DB pod starts fast on large volumes.
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      {{- with coalesce .Values.agent.db.tolerations .Values.agent.tolerations .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.agent.db.nodeSelector .Values.agent.nodeSelector .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.agent.db.affinity .Values.agent.affinity .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
