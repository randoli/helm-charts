{{- if .Values.observability.logs.applyVectorPipeline  -}}
{{- $diskBuffer := (.Values.observability.logs.diskBuffer | default dict) -}}
apiVersion: observability.kaasops.io/v1alpha1
kind: ClusterVectorPipeline
metadata:
  name: randoli-obs-loki-log-sync
spec:
  sinks:
    loki:
      encoding:
        codec: json
        only_fields:
          - message
          - trace_id
          - randoli_tags
      endpoint: {{ include "logs-loki-url" . }}
      inputs:
      {{- if and .Values.observability.logs.multilineLogs.enabled .Values.observability.logs.randoliTags.enabled }}
        - extract_runtime_exceptions
      {{- else }}
        - extract_trace_id
      {{- end }}
      labels:
        forwarder: vector
        k8s_container_image: {{ `'{{ kubernetes.container_image }}'` }}
        k8s_container_name: {{ `'{{ kubernetes.container_name }}'` }}
        k8s_pod_name: {{ `'{{ kubernetes.pod_name }}'` }}
        k8s_pod_namespace: {{ `'{{ kubernetes.pod_namespace }}'` }}
        k8s_pod_node_name: {{ `'{{ kubernetes.pod_node_name }}'` }}
        service_name: {{ `'{{ service_name }}'` }}
        source_type: {{ `'{{ source_type }}'` }}
      tenant_id: self-monitoring
      type: loki
      # Disable healthcheck
      healthcheck:
        enabled: false
      # Retry configuration
      request:
        retry_attempts: 10
        retry_initial_backoff_secs: 1
        retry_max_duration_secs: 300
        timeout_secs: 60
      {{- if $diskBuffer.enabled }}
      # On-disk buffer absorbs back-pressure when Loki is slow or unavailable.
      # Backed by the PVC mounted at the Vector agent's dataDir
      buffer:
        type: disk
        max_size: {{ $diskBuffer.bufferSize }}
        when_full: {{ $diskBuffer.whenFull | default "drop_newest" }}
      {{- end }}

  sources:
    # prepare include and exclude list
    {{- $include := .Values.observability.logs.includeNamespaces | default list }}
    {{- $exclude := .Values.observability.logs.excludeNamespaces | default list }}
    {{- if gt (len $include) 0 }}
    # Include list: one kubernetes_logs source per namespace. Each source ins pinned to a specific Kubernetes namespace.
    # It won't scrape logs from any other namespace which is not listed here
    {{- range $ns := $include }}
    k8s_log_source_{{ $ns | replace "-" "_" }}:
      extra_label_selector: app.kubernetes.io/name!=vector
      extra_field_selector: metadata.namespace={{ $ns }}
      read_from: end
      type: kubernetes_logs
    {{- end }}
    {{- else }}
    k8s_log_source:
      extra_label_selector: app.kubernetes.io/name!=vector
      {{- if gt (len $exclude) 0 }}
      # Exclude namespaces via metadata fields
      # This exclude list will be completely ignored if the include list is not empty
      # ALternatively, users can use the following annotations to exclude objects
      # vector.dev/exclude-containers: "container1,container2"
      # vector.dev/exclude: "true" (ns level or in the pod spec template)
      extra_field_selector: {{ range $i, $ns := $exclude }}{{ if $i }},{{ end }}metadata.namespace!={{ $ns }}{{- end }}
      {{- end }}
      read_from: end
      type: kubernetes_logs
    {{- end }}

  transforms:
    {{- if .Values.observability.logs.multilineLogs.enabled }}
    {{ include "vector.multilineLogs.transform" (dict
    "include" $include
    ) | nindent 4 }}
    {{- end }}

    drop_empty_containers:
      condition: '!(.kubernetes.container_name == null)'
      inputs:
      {{- if .Values.observability.logs.multilineLogs.enabled }}
        - merge_multiline_logs
      {{- else }}
      {{- if gt (len $include) 0 }}
      {{- range $ns := $include }}
        - k8s_log_source_{{ $ns | replace "-" "_" }}
      {{- end }}
      {{- else }}
        - k8s_log_source
      {{- end }}
      {{- end }}
      type: filter

    drop_empty_message:
      condition: >-
        !(strip_whitespace!(.message) == "") || !(.kubernetes.container_name == null)
      inputs:
        - drop_empty_containers
      type: filter

    dedot_transform:
      inputs:
        - drop_empty_message
      source: >-
        . = map_keys(., recursive: true) -> |key| { replace(key, r'[./-]', "_")}
      type: remap

    drop_fields:
      drop_on_abort: true
      inputs:
        - dedot_transform
      source: |-
        del(.kubernetes.node_labels)
        del(.kubernetes.container_image_id)
        del(.kubernetes.namespace_labels)
        del(.kubernetes.pod_ip)
        del(.kubernetes.pod_ips)
        del(.kubernetes.pod_uid)
      type: remap

    extract_message:
      inputs:
        - drop_fields
      source: >
        parsed = parse_json!(.message);

        .message = parsed; 
        # now .message contains the parsed object, and kubernetes.* fields still exist

      type: remap
  
    extract_service_name:
      inputs:
        - extract_message
      source: |
        service_name = null;

        if exists(.kubernetes.pod_annotations.resource_opentelemetry_io_service_name) {
          service_name = .kubernetes.pod_annotations.resource_opentelemetry_io_service_name
        }

        .service_name = service_name
      type: remap 

    extract_trace_id:
      inputs:
        - extract_service_name
      type: remap
      source: |
        # first try structured JSON
        if exists(.message.trace_details.trace_id) {
          .trace_id = .message.trace_details.trace_id
        }
        else {
          message_str = encode_json(.message)

          matches = parse_regex(
            message_str,
            r'(?i)traceId:\s*(?P<trace_id>[a-f0-9]{32})'
          ) ?? null

          if !is_null(matches) {
            .trace_id = matches.trace_id
          }
        }  

  {{- if and .Values.observability.logs.multilineLogs.enabled .Values.observability.logs.randoliTags.enabled }}
  {{ include "vector.randoliTags.transform" . | nindent 4 }}
  {{- end }}

{{end}} 
