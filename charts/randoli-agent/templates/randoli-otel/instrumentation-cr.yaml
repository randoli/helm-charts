{{- if .Values.tags.observability -}}
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: otel-instrumentation
spec:
  exporter:
    endpoint: http://randoli-otel-collector.{{ .Release.Namespace }}.svc:4317
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  python:
    image: {{ .Values.otelCollector.instrumentationImages.python }}
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://randoli-otel-collector.{{ .Release.Namespace }}.svc:4318
  dotnet:
    image: {{ .Values.otelCollector.instrumentationImages.dotnet }}
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://randoli-otel-collector.{{ .Release.Namespace }}.svc:4318
  go:
    image: {{ .Values.otelCollector.instrumentationImages.go }}
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://randoli-otel-collector.{{ .Release.Namespace }}.svc:4318
      - name: OTEL_GO_AUTO_INCLUDE_DB_STATEMENT
        value: "true"
      - name: OTEL_GO_AUTO_PARSE_DB_STATEMENT
        value: "true"
  nodejs:
    image: {{ .Values.otelCollector.instrumentationImages.nodejs }}
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://randoli-otel-collector.{{ .Release.Namespace }}.svc:4318
  java:
    image: {{ .Values.otelCollector.instrumentationImages.java }}
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://randoli-otel-collector.{{ .Release.Namespace }}.svc:4318
{{- end }}
