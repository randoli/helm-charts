apiVersion: v1
kind: ConfigMap
metadata:
  name: randoli-tproxy
  namespace: {{ include "randoli-agent.namespace" . }}
data:
  LISTEN_ADDR: ':8080'
  ENABLE_CORS: 'true'
  {{- with .Values.tproxy.cors }}
  CORS_ALLOW_ORIGIN: {{ . | quote }}
  {{- end }}
  KEYCLOAK_ISSUER_URL: {{ include "telemetry-proxy-keycloak-issuer" . }}
  TEMPO_BASE_URL: {{ include "trace-storage-url" . }}
  PROMETHEUS_BASE_URL: {{ include "prometheus-server-endpoint" . }}
  LOKI_BASE_URL: {{ include "logs-loki-read-url" . }}

  {{- if .Values.tags.sreAgent }}
  CHATBOT_BASE_URL: {{ include "sre-agent-http-endpoint" . }}
  {{- end }}

  {{- if .Values.tproxy.otelInstrumentation.enabled }}
  OTEL_ENABLED: 'true'
  {{- if .Values.tproxy.otelInstrumentation.otlpEndpoint }}

  {{- /* eventhough we are using gRPC here, the OTel SDK expects http:// prefix to be added to the endpoint */ -}}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tproxy.otelInstrumentation.otlpEndpoint | quote }}
  {{- else }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "otel-collector-grpc-endpoint-http-prefix" . | quote }}
  {{- end }}
  OTEL_TRACE_SAMPLE_RATIO: {{ .Values.tproxy.otelInstrumentation.traceSampleRatio | quote }}
  {{- end }}

  {{- with .Values.tproxy.tunnelServerAddr }}
  TUNNEL_SERVER_ADDR: {{ . | quote }}
  {{- end }}
  {{- with .Values.tproxy.mode }}
  MODE: {{ . | quote }}
  {{- end }}
