apiVersion: apps/v1
kind: Deployment
metadata:
  name: randoli-tproxy
  namespace: {{ include "randoli-agent.namespace" . }}
  labels:
    app.kubernetes.io/name: randoli-tproxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: randoli-tproxy
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.tproxy.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    resource.opentelemetry.io/service.name: randoli-tproxy
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.tproxy.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: randoli-tproxy
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: randoli-tproxy
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: randoli-tproxy
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: randoli-tproxy
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.tproxy.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.global.annotations .Values.tproxy.annotations }}
      annotations:
        {{- with .Values.global.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.tproxy.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      containers:
        - name: randoli-tproxy
          {{- with .Values.tproxy.image }}
          image: "{{- if .registry -}}{{ .registry }}/{{- end -}}{{ .repository }}:{{ .tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.tproxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path:  /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.config }}
                  key: CLUSTER_ID
            {{- if not .Values.tproxy.keycloakIssuer }}
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.config }}
                  key: KEYCLOAK_SERVICE_URL
                  optional: true
            - name: KEYCLOAK_REALM_TPROXY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.config }}
                  key: KEYCLOAK_REALM_TPROXY
                  optional: true
            {{- end }}
            {{- if empty .Values.tproxy.cors }}
            # Console origin provisioned into the agent secret. Skipped when
            # tproxy.cors is set explicitly, so the ConfigMap value wins.
            - name: CORS_ALLOW_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.config }}
                  key: CONSOLE_URL
                  optional: true
            {{- end }}
            {{- include "agent-db-env" (dict "ctx" . "user" "tproxy" "passwordKey" "tproxy-password") | nindent 12 }}
          envFrom:
            - configMapRef:
                name: randoli-tproxy
          resources:
            limits:
              cpu: 200m
              memory: "512Mi"
            requests:
              cpu: 30m
              memory: "128Mi"
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.tproxy.tolerations .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.tproxy.nodeSelector .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with coalesce .Values.tproxy.affinity .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: tproxy
      serviceAccount: tproxy
