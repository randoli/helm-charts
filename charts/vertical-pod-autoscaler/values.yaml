# Values passed through to the upstream kubernetes/vertical-pod-autoscaler chart.
# Full upstream value reference:
# https://github.com/kubernetes/autoscaler/blob/master/charts/vertical-pod-autoscaler/values.yaml
vertical-pod-autoscaler:
  fullnameOverride: "randoli-cmk-vpa"

  # Reduced to 1 replica each (upstream defaults to 2).
  #
  # PodDisruptionBudget: the upstream chart defaults each component's PDB to
  # minAvailable: 1. Combined with a single replica that makes the pod
  # permanently unevictable, so a node running it can never be drained /
  # decommissioned (cluster-autoscaler scale-down hangs). Switch to
  # maxUnavailable: 1 (and clear minAvailable) so the single pod can be
  # evicted; the VPA components self-recover on reschedule.
  #
  # minAvailable is cleared with 0 instead of null to make the helm chart compatible with Helm 3.x versions.
  # But still the best practice is to use null as it sets the default from upstream values file.
  admissionController:
    replicas: 1
    podDisruptionBudget:
      enabled: true
      minAvailable: 0
      maxUnavailable: 1

  recommender:
    replicas: 1
    podDisruptionBudget:
      enabled: true
      minAvailable: 0
      maxUnavailable: 1

  updater:
    replicas: 1
    podDisruptionBudget:
      enabled: true
      minAvailable: 0
      maxUnavailable: 1

  # Scheduling — global.* values are NOT automatically propagated here.
  # Set admissionController.tolerations / nodeSelector / affinity,
  # recommender.tolerations / nodeSelector / affinity,
  # updater.tolerations / nodeSelector / affinity explicitly.

  # imagePullSecrets — set explicitly to match global.imagePullSecrets.
  imagePullSecrets: []
